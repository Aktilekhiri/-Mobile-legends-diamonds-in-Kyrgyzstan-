<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<script>if(window.parent===window){location.replace('admin.html#'+(location.pathname.indexOf('orders')>-1?'orders':(location.pathname.indexOf('reviews')>-1?'reviews':(location.pathname.indexOf('clients')>-1?'clients':(location.pathname.indexOf('bot')>-1?'bot':(location.pathname.indexOf('finance')>-1?'finance':'accounts'))))))}</script>

<title>Финансы — diamond.kg</title>
<style>
:root{--bg:#0B1020;--card:#151D33;--line:rgba(170,184,208,.2);--tx:#f0f4ff;--mu:#AAB8D0;--gold:#32D9F5;--blue:#7C83FF;--red:#ff5d5d;--green:#25D366}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 80px}
h1{font-size:1.4rem;margin:8px 0 12px}
a{color:var(--gold)}
label{display:block;font-size:.85rem;color:var(--mu);margin:12px 0 4px}
input{width:100%;background:#0B1020;color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit;min-height:46px}
button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:12px 16px;cursor:pointer;min-height:46px;color:var(--tx);background:#1D2943}
button.pri{background:var(--gold);color:#0B1020}
button.ok{background:var(--green);color:#06210f}
button.dng{background:#5a1f2a;color:#ffd6d6}
button:disabled{opacity:.5;cursor:default}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.hidden{display:none}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chips button{min-height:38px;padding:6px 12px;font-size:.9rem}
.chips button.on{background:var(--gold);color:#0B1020}
.o-head{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.o-head b{font-size:1.05rem}
.o-sum{font-weight:800;color:var(--gold);white-space:nowrap}
.o-meta{color:var(--mu);font-size:.88rem;margin:4px 0 10px;word-break:break-word}
.st{font-size:.75rem;padding:2px 8px;border-radius:999px;background:#1D2943;margin-left:6px;white-space:nowrap}
.st.new{background:#7a5a0a}.st.processing{background:#1D2943}.st.delivered{background:#12633a}
.st.refund_due{background:#7a1f2a}.st.refunded{background:#555d6e}.st.manual{background:#6b4a12}.st.cancelled{background:#444}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.acts button{flex:1 1 140px}
.err{color:#ffd6d6;background:#5a1f2a;padding:10px 12px;border-radius:10px;margin-bottom:12px}
.good{color:#06210f;background:var(--green);padding:10px 12px;border-radius:10px;margin-bottom:12px}
.hint{color:var(--mu);padding:8px 0}
.warn{color:#ffd28a;font-size:.85rem;margin-top:6px}
.rcpt img{display:block;max-width:100%;max-height:420px;border-radius:10px;border:1px solid var(--line);margin-top:10px;background:#0B1020}
.rcpt-hint{color:var(--mu);font-size:.85rem;margin-top:6px}
.stars{color:#F59E0B;letter-spacing:2px}.txt{margin:8px 0;white-space:pre-wrap;word-break:break-word}.st.pending{background:#7a5a0a}.st.approved{background:#12633a}.st.hidden{background:#444}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:8px}.kpi div{background:#0B1020;border:1px solid var(--line);border-radius:12px;padding:10px}.kpi small{display:block;color:var(--mu);font-size:.78rem}.kpi b{font-size:1.15rem}
.row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.row span:first-child{color:var(--mu)}
.big{font-size:1.6rem;font-weight:800;color:var(--gold)}.plan .step{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}.plan .step:last-child{border:0}.plan .n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--gold);color:#0B1020;display:grid;place-items:center;font-weight:800}
.neg{color:#ff9b9b}.pos{color:#7be0a6}
</style>
</head>
<body>
<div class="wrap">
  <div id="msg"></div>
  <div class="card hidden" id="loginBox">
    <label for="pw">Пароль админки</label>
    <input id="pw" type="password" autocomplete="current-password">
    <div style="margin-top:10px"><button class="pri" id="loginBtn">Войти</button></div>
  </div>
  <div id="listBox" class="hidden">
    <div id="fin"></div>
    <div class="top" style="margin-top:14px"><button id="reload">Обновить</button><button id="logoutBtn">Выйти</button></div>
  </div>
</div>
<script src="api-config.js"></script>
<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  var TK='dk_admin_token', AK='dk_admin_api';
  var token='', data=null, wk='last';
  function sget(k){try{return localStorage.getItem(k)||''}catch(e){return ''}}
  function sset(k,v){try{v?localStorage.setItem(k,v):localStorage.removeItem(k)}catch(e){}}
  function api(){return (window.DK_API||sget(AK)||'').replace(/\/+$/,'')}
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function msg(t,k){$('msg').innerHTML=t?'<div class="'+(k||'good')+'">'+esc(t)+'</div>':''}
  function show(id){['loginBox','listBox'].forEach(function(x){$(x).classList.toggle('hidden',x!==id)})}
  function n(v){return Math.round(v).toLocaleString('ru-RU').replace(/\u00a0/g,' ')}
  async function call(method,path,body){
    var h={}; if(token)h.Authorization='Bearer '+token;
    var o={method:method,headers:h};
    if(body!==undefined){h['Content-Type']='application/json';o.body=JSON.stringify(body)}
    var r=await fetch(api()+path,o), d={}; try{d=await r.json()}catch(e){}
    if(r.status===401&&path!=='/api/login'){token='';sset(TK,'');show('loginBox');throw new Error('Войдите заново')}
    if(!r.ok)throw new Error(d.error||('Ошибка '+r.status));
    return d;
  }
  function pr(v){return '<b class="'+(v<0?'neg':'pos')+'">'+(v<0?'−':'+')+n(Math.abs(v))+' сом</b>'}
  function period(title,s){return '<div class="card"><div class="o-head"><b>'+title+'</b><span class="o-meta" style="margin:0">'+s.n+' зак.</span></div>'
    +'<div class="row"><span>Выручка</span><b>'+n(s.rev)+' сом</b></div><div class="row"><span>Себестоимость</span><b>'+n(s.cost)+' сом</b></div><div class="row"><span>Прибыль</span>'+pr(s.profit)+'</div>'
    +(s.promo_n?'<div class="row"><span>Промо ('+s.promo_n+' шт)</span><b class="neg">−'+n(s.promo_cost)+' сом</b></div><div class="warn">Бесплатные Weekly Pass: в прибыль не входят, но деньги потрачены.</div>':'')+(s.nocost?'<div class="warn">У '+s.nocost+' заказ(ов) нет себестоимости: они не входят в прибыль.</div>':'')+'</div>'}
  function render(){
    var f=data, p=wk==='week'?f.plan_week:f.plan_last, w=wk==='week'?f.week:f.last_week, h='';
    h+='<div class="card"><div class="o-head"><b>FazerCards</b><span class="o-meta" style="margin:0">курс '+f.rate+'</span></div>'
      +'<div class="kpi"><div><small>Баланс</small><b>'+(f.balance_usd==null?'—':'$'+f.balance_usd.toFixed(2))+'</b></div>'
      +'<div><small>Хватит примерно на</small><b>'+(f.days_left==null?'—':f.days_left+' дн.')+'</b></div>'
      +'<div><small>Расход в день</small><b>$'+f.spend_per_day_usd.toFixed(2)+'</b></div>'
      +'<div><small>В сомах</small><b>'+(f.balance_kgs==null?'—':n(f.balance_kgs)+' сом')+'</b></div></div></div>';
    var bk=new Date(Date.now()+6*3600000), planOn=bk.getUTCDay()===1&&bk.getUTCHours()>=14;   // Бишкек UTC+6: план виден по понедельникам с 14:00
    if(!planOn) h+='<div class="card"><div class="o-head"><b>Что перевести за неделю</b></div><div class="o-meta">План переводов показывается по понедельникам с 14:00 (по итогам прошлой недели) и приходит в Telegram.</div></div>';
    else h+='<div class="card plan"><div class="o-head"><b>Что перевести за неделю</b></div>'
      +'<div class="chips" style="margin-top:8px"><button data-w="week" class="'+(wk==='week'?'on':'')+'">Эта неделя</button><button data-w="last" class="'+(wk==='last'?'on':'')+'">Прошлая неделя</button></div>'
      +'<div class="o-meta">Выручка '+n(w.rev)+' сом · прибыль '+(w.profit<0?'−':'')+n(Math.abs(w.profit))+' сом</div>'
      +'<div class="step"><span class="n">1</span><div>Переведите на карту-сейф (Simbank)<div class="big">'+n(p.to_safe)+' сом</div><div class="o-meta" style="margin:0">Прибыль минус резерв '+n(p.reserve)+' сом (комиссии, курс, возвраты)'+(p.promo_cost?' и промо '+n(p.promo_cost)+' сом':'')+'</div></div></div>'
      +'<div class="step"><span class="n">2</span><div>Остальное оставьте на Mbank и O!Банк<div class="o-meta" style="margin:2px 0 0">Это оборотные деньги на закупку: '+n(p.keep)+' сом</div></div></div>'
      +'<div class="step"><span class="n">3</span><div>'+(p.buy_usd>0?'Докупите USDT для FazerCards<div class="big">$'+p.buy_usd+' ≈ '+n(p.buy_kgs)+' сом</div><div class="o-meta" style="margin:0">Одним платежом: комиссия сети 1 USDT одна. Расход за неделю ≈ $'+p.weekly_spend_usd+', держим запас не ниже $'+f.constants.min_balance_usd+'</div>':'Пополнять FazerCards пока не нужно<div class="o-meta" style="margin:2px 0 0">Баланса хватает с запасом (расход за неделю ≈ $'+p.weekly_spend_usd+')</div>')+'</div></div>'
      +'<div class="warn">Это оценка по каталожным ценам. Каждый понедельник в 14:00 в Telegram приходит план по итогам прошлой недели.</div></div>';
    h+=period('Сегодня',f.today)+period('Эта неделя (с понедельника)',f.week)+period('Прошлая неделя',f.last_week)+period('С начала месяца',f.month)+period('За всё время',f.all);
    $('fin').innerHTML=h;
    Array.prototype.forEach.call(document.querySelectorAll('[data-w]'),function(b){b.onclick=function(){wk=b.dataset.w;render()}});
  }
  async function load(){try{data=await call('GET','/api/admin/finance');show('listBox');msg('');render()}catch(e){msg(e.message,'err')}}
  function start(){token=sget(TK);msg('');if(!api()){msg('Не задан адрес API (api-config.js)','err');return}if(!token){show('loginBox');return}load()}
  $('loginBtn').onclick=async function(){var b=this;b.disabled=true;try{var d=await call('POST','/api/login',{password:$('pw').value});token=d.token;sset(TK,token);$('pw').value='';start()}catch(e){msg(e.message,'err')}b.disabled=false};
  $('pw').addEventListener('keydown',function(e){if(e.key==='Enter')$('loginBtn').click()});
  $('logoutBtn').onclick=function(){token='';sset(TK,'');show('loginBox')};
  $('reload').onclick=load;
  start();
})();
</script>
</body>
</html>
