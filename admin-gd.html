<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>GamesDrop: проверка</title>
<style>
:root{--bg:#0B1020;--card:#151D33;--line:rgba(170,184,208,.2);--tx:#f0f4ff;--mu:#AAB8D0;--gold:#32D9F5}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
input{width:100%;box-sizing:border-box;background:#0B1020;color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit;min-height:46px}
button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:12px 16px;min-height:46px;background:var(--gold);color:#0B1020;margin-top:10px;width:100%}
label{display:block;color:var(--mu);font-size:.85rem;margin:10px 0 4px}
pre{white-space:pre-wrap;word-break:break-word;font-size:.8rem;color:var(--mu)}
</style></head><body>
<div class="card"><b>GamesDrop: проверка связи</b>
<p style="color:var(--mu);font-size:.9rem;margin:6px 0 0">Показывает баланс и ищет игру в каталоге. Ничего не покупает. Тестовый заказ отправляется только на тестовый оффер 999 (Steam US) и только по галочке.</p>
<label for="q">Поиск в каталоге</label><input id="q" value="standoff">
<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="t" style="width:auto;min-height:0"> Отправить тестовый заказ (оффер 999)</label>
<button id="go">Проверить</button></div>
<div class="card"><pre id="out">Нажмите «Проверить».</pre></div>
<script src="api-config.js"></script>
<script>
var $=function(i){return document.getElementById(i)};
function sget(k){try{return localStorage.getItem(k)||''}catch(e){return ''}}
$('go').onclick=async function(){
  var b=this;b.disabled=true;$('out').textContent='Проверяем…';
  try{
    var base=(window.DK_API||sget('dk_admin_api')||'').replace(/\/+$/,'');
    var r=await fetch(base+'/api/admin/gamesdrop/probe',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+sget('dk_admin_token')},body:JSON.stringify({search:$('q').value.trim(),test_order:$('t').checked})});
    var d=await r.json().catch(function(){return {}});
    $('out').textContent=r.status===401?'Войдите в админку (вкладка «Заказы») и повторите.':JSON.stringify(d,null,2);
  }catch(e){$('out').textContent='Нет связи: '+e.message}
  b.disabled=false;
};
</script></body></html>
