<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<script>if(window.parent===window){location.replace('admin.html#'+(location.pathname.indexOf('orders')>-1?'orders':'accounts'))}</script>

<title>Заказы — diamond.kg</title>
<style>
:root{--bg:#0B1020;--card:#151D33;--line:rgba(170,184,208,.2);--tx:#f0f4ff;--mu:#AAB8D0;--gold:#32D9F5;--blue:#7C83FF;--red:#ff5d5d;--green:#25D366}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 80px}
h1{font-size:1.4rem;margin:8px 0 12px}
a{color:var(--gold)}
label{display:block;font-size:.85rem;color:var(--mu);margin:12px 0 4px}
input{width:100%;background:#0B1020;color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit;min-height:46px}
button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:12px 16px;cursor:pointer;min-height:46px;color:var(--tx);background:#1D2943}
button.pri{background:var(--gold);color:#0B1020}
button.ok{background:var(--green);color:#06210f}
button.dng{background:#5a1f2a;color:#ffd6d6}
button:disabled{opacity:.5;cursor:default}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.hidden{display:none}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chips button{min-height:38px;padding:6px 12px;font-size:.9rem}
.chips button.on{background:var(--gold);color:#0B1020}
.o-head{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.o-head b{font-size:1.05rem}
.o-sum{font-weight:800;color:var(--gold);white-space:nowrap}
.o-meta{color:var(--mu);font-size:.88rem;margin:4px 0 10px;word-break:break-word}
.st{font-size:.75rem;padding:2px 8px;border-radius:999px;background:#1D2943;margin-left:6px;white-space:nowrap}
.st.new{background:#7a5a0a}.st.processing{background:#1D2943}.st.delivered{background:#12633a}
.st.refund_due{background:#7a1f2a}.st.refunded{background:#555d6e}.st.balance{background:#12633a}.st.manual{background:#6b4a12}.st.cancelled{background:#444}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.acts button{flex:1 1 140px}
.err{color:#ffd6d6;background:#5a1f2a;padding:10px 12px;border-radius:10px;margin-bottom:12px}
.good{color:#06210f;background:var(--green);padding:10px 12px;border-radius:10px;margin-bottom:12px}
.hint{color:var(--mu);padding:8px 0}
.warn{color:#ffd28a;font-size:.85rem;margin-top:6px}
.rcpt img{display:block;max-width:100%;max-height:420px;border-radius:10px;border:1px solid var(--line);margin-top:10px;background:#0B1020}
.rcpt-hint{color:var(--mu);font-size:.85rem;margin-top:6px}
</style>
</head>
<body>
<div class="wrap">
    <div id="msg"></div>

  <div class="card hidden" id="loginBox">
    <label for="pw">Пароль админки</label>
    <input id="pw" type="password" autocomplete="current-password">
    <div style="margin-top:10px"><button class="pri" id="loginBtn">Войти</button></div>
  </div>

  <div id="listBox" class="hidden">
    <div class="chips" id="chips"></div>
    <div id="list"></div>
    <details class="card" id="blBox" style="margin-top:14px">
      <summary style="cursor:pointer;font-weight:700">🚫 Чёрный список телефонов <span id="blCount" style="font-weight:400;opacity:.7"></span></summary>
      <div style="margin-top:10px">
        <label for="blPhone" style="display:block;font-size:13px;opacity:.8;margin-bottom:4px">Номер телефона (проверить или добавить)</label>
        <input id="blPhone" type="tel" inputmode="tel" placeholder="777 090 210" style="width:100%;box-sizing:border-box;padding:10px;border-radius:10px;border:1px solid var(--line);background:transparent;color:inherit;margin-bottom:8px">
        <label for="blReason" style="display:block;font-size:13px;opacity:.8;margin-bottom:4px">Причина</label>
        <input id="blReason" type="text" maxlength="200" placeholder="Например: требовал возврат после выдачи" style="width:100%;box-sizing:border-box;padding:10px;border-radius:10px;border:1px solid var(--line);background:transparent;color:inherit;margin-bottom:8px">
        <div class="top"><button id="blCheck">Проверить номер</button><button id="blAdd">Добавить в список</button></div>
        <div id="blRes" style="margin:8px 0;font-size:14px"></div>
        <div id="blList"></div>
      </div>
    </details>
    <div class="top" style="margin-top:14px"><button id="reload">Обновить</button><button id="logoutBtn">Выйти</button></div>
  </div>
</div>
<script src="api-config.js"></script>
<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  var TK='dk_admin_token', AK='dk_admin_api';
  var token='', filter='active', orders=[], timer=null;
  function sget(k){try{return localStorage.getItem(k)||''}catch(e){return ''}}
  function sset(k,v){try{v?localStorage.setItem(k,v):localStorage.removeItem(k)}catch(e){}}
  function api(){return (window.DK_API||sget(AK)||'').replace(/\/+$/,'')}
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function msg(t,k){$('msg').innerHTML=t?'<div class="'+(k||'good')+'">'+esc(t)+'</div>':''}
  function show(id){['loginBox','listBox'].forEach(function(x){$(x).classList.toggle('hidden',x!==id)})}

  async function call(method,path,body){
    var h={}; if(token)h.Authorization='Bearer '+token;
    var o={method:method,headers:h};
    if(body!==undefined){h['Content-Type']='application/json';o.body=JSON.stringify(body)}
    var ac=window.AbortController?new AbortController():null, tm=null;
    if(ac){o.signal=ac.signal;tm=setTimeout(function(){ac.abort()},15000)}
    var r; try{r=await fetch(api()+path,o)}catch(e){throw new Error('Сервер не отвечает. Проверьте интернет и нажмите «Обновить».')}finally{if(tm)clearTimeout(tm)}
    var d={}; try{d=await r.json()}catch(e){}
    if(r.status===401&&path!=='/api/login'){token='';sset(TK,'');show('loginBox');throw new Error('Войдите заново')}
    if(!r.ok)throw new Error(d.error||('Ошибка '+r.status));
    return d;
  }

  var LBL={new:'Ждёт оплаты',processing:'Выдаётся',delivered:'Выдан',refund_due:'Вернуть деньги',refunded:'Деньги возвращены',balance:'Возвращено на баланс',manual:'Выдать вручную',cancelled:'Отменён'};
  var FILTERS=[['active','Активные'],['auto','⚡ Авто'],['all','Все'],['delivered','Выданные'],['refund_due','Возвраты'],['unpaid','Не оплачены']];
  // Finik-заказ в статусе «new» — клиент ещё не оплатил (ссылка на оплату живёт час): выдавать такой нельзя
  function unpaid(o){return o.status==='new'&&o.method==='Finik'}
  function isAuto(o){return (o.method==='Finik'||o.method==='Баланс')&&!unpaid(o)}
  function isActive(o){return ['new','processing','refund_due','manual'].indexOf(o.status)>-1&&!unpaid(o)}

  function drawChips(){
    $('chips').innerHTML=FILTERS.map(function(f){return '<button data-f="'+f[0]+'" class="'+(f[0]===filter?'on':'')+'">'+f[1]+'</button>'}).join('');
    Array.prototype.forEach.call($('chips').querySelectorAll('button'),function(b){b.onclick=function(){filter=b.dataset.f;drawChips();draw()}});
  }
  function ago(ts){var m=Math.round((Date.now()-ts)/60000);if(m<1)return 'только что';if(m<60)return m+' мин назад';var h=Math.round(m/60);if(h<24)return h+' ч назад';return new Date(ts).toLocaleDateString('ru-RU')}

  function draw(){
    var rows=orders.filter(function(o){return filter==='all'||(filter==='active'?isActive(o):filter==='auto'?isAuto(o):filter==='unpaid'?unpaid(o):o.status===filter)});
    if(!rows.length){$('list').innerHTML='<div class="card hint">Заказов нет</div>';return}
    $('list').innerHTML=rows.map(function(o){
      var acts='';
      if(unpaid(o))acts='<button class="dng" data-a="cancel" data-id="'+o.id+'">Отменить</button>';
      else if(o.status==='new')acts='<button class="ok" data-a="confirm" data-id="'+o.id+'">✅ Деньги пришли — выдать</button><button class="dng" data-a="cancel" data-id="'+o.id+'">Отменить</button>';
      else if(o.status==='manual')acts='<button class="ok" data-a="manual-done" data-id="'+o.id+'">Выдал вручную</button><button class="dng" data-a="to-balance" data-id="'+o.id+'">↩️ Вернуть на баланс</button><button class="dng" data-a="cancel" data-id="'+o.id+'">Отменить</button>';
      else if(o.status==='processing')acts='<button data-a="refresh" data-id="'+o.id+'">Проверить статус</button><button class="dng" data-a="to-balance" data-id="'+o.id+'">↩️ Вернуть на баланс</button>';
      else if(o.status==='refund_due')acts='<button class="ok" data-a="refunded" data-id="'+o.id+'">Деньги клиенту возвращены</button><button data-a="to-balance" data-id="'+o.id+'">↩️ Вернуть на баланс</button>';
      if(o.phone&&String(o.phone).replace(/\D/g,'').length>=9&&o.status!=='new')acts+='<button class="dng" data-a="blacklist" data-id="'+o.id+'">🚫 В чёрный список</button>';
      var hasR=o.receipt_at>0, canR=(o.status==='new'||o.status==='manual');
      if(hasR)acts='<button data-a="receipt" data-id="'+o.id+'">📎 '+(rcOpen[o.id]?'Скрыть чек':'Показать чек')+'</button>'+acts;
      var rnote=unpaid(o)?'<div class="rcpt-hint">Клиент ещё не оплатил по ссылке Finik. Когда оплатит, заказ выдастся сам.</div>':(!hasR&&canR)?'<div class="rcpt-hint">Чека на сайте нет — проверьте оплату по банку (возможно, клиент отправил через WhatsApp)</div>':'';
      var warn=o.status==='refund_due'?'<div class="warn">Заказ не выполнен. Верните клиенту '+o.price_kgs+' сом на '+esc(o.method||'карту')+(o.phone?' ('+esc(o.phone)+')':'')+'. '+esc(o.fail_reason||'')+'</div>':(o.status==='processing'&&o.fail_reason?'<div class="warn">'+esc(o.fail_reason)+'</div>':'');
      return '<div class="card"><div class="o-head"><div><b>'+esc(o.id)+'</b><span class="st '+o.status+'">'+(unpaid(o)?'Не оплачен':(LBL[o.status]||o.status))+'</span>'+(isAuto(o)?'<span class="st">⚡ авто</span>':'')+'</div><div class="o-sum">'+o.price_kgs+' сом</div></div>'
        +'<div class="o-meta">'+esc(o.pkg_label)+' · ID '+esc(o.player_id)+' ('+esc(o.server_id)+') · '+esc(o.method||'—')+(o.phone?' · '+esc(o.phone):'')+' · '+ago(o.created_at)+'</div>'
        +warn+rnote+(acts?'<div class="acts" style="margin-top:8px">'+acts+'</div>':'')+'<div class="rcpt" id="rc-'+o.id+'"></div></div>';
    }).join('');
    Array.prototype.forEach.call($('list').querySelectorAll('button[data-a]'),function(b){b.onclick=function(){b.dataset.a==='receipt'?toggleReceipt(b):act(b)}});
    Object.keys(rcOpen).forEach(function(id){if(rcOpen[id])paintReceipt(id)});
  }

  var rcCache={}, rcOpen={};
  function paintReceipt(id){
    var box=$('rc-'+id); if(!box||!rcCache[id])return;
    box.innerHTML='<a href="'+rcCache[id]+'" target="_blank" rel="noopener"><img alt="Чек клиента" src="'+rcCache[id]+'"></a>';
  }
  async function toggleReceipt(b){
    var id=b.dataset.id;
    if(rcOpen[id]){rcOpen[id]=false;var bx=$('rc-'+id);if(bx)bx.innerHTML='';b.textContent='📎 Показать чек';return}
    b.disabled=true;
    try{
      if(!rcCache[id]){
        var r=await fetch(api()+'/api/admin/orders/'+id+'/receipt',{headers:{Authorization:'Bearer '+token}});
        if(r.status===401){token='';sset(TK,'');show('loginBox');throw new Error('Войдите заново')}
        if(!r.ok)throw new Error('Чек не найден');
        rcCache[id]=URL.createObjectURL(await r.blob());
      }
      rcOpen[id]=true;paintReceipt(id);b.textContent='📎 Скрыть чек';
    }catch(e){msg(e.message,'err')}
    b.disabled=false;
  }
  async function act(b){
    var a=b.dataset.a,id=b.dataset.id,o=orders.filter(function(x){return x.id===id})[0]||{};
    if(a==='confirm'&&!confirm('Заказ '+id+': '+o.pkg_label+'\nID '+o.player_id+' ('+o.server_id+')\nСумма '+o.price_kgs+' сом\n\nДеньги на счёт точно поступили? Алмазы будут выданы сразу.'))return;
    if(a==='cancel'&&!confirm('Отменить заказ '+id+'?'))return;
    if(a==='refunded'&&!confirm('Вы вернули клиенту деньги за заказ '+id+'?'))return;
    if(a==='to-balance'&&!confirm('Вернуть '+o.price_kgs+' сом клиенту на баланс сайта за заказ '+id+'?\n\nСначала проверьте у поставщика (FazerCards), что заказ не выдан и не выдастся: иначе клиент получит и товар, и деньги.'))return;
    if(a==='blacklist'&&!confirm('Занести телефон '+(o.phone||'')+' в чёрный список? С этого номера больше нельзя будет создать заказ.'))return;
    b.disabled=true;
    try{var d=await call('POST','/api/admin/orders/'+id+'/'+a);msg(a==='confirm'?'Заказ '+id+' отправлен на выдачу':a==='blacklist'?'Телефон занесён в чёрный список':a==='to-balance'?'Вернули на баланс клиента, он получил уведомление':'Готово','good');await load()}
    catch(e){msg(e.message,'err');b.disabled=false}
  }
  async function load(){
    try{var d=await call('GET','/api/admin/orders');orders=d.orders||[];msg('');show('listBox');drawChips();draw();if(!bl.length)blLoad()}
    catch(e){msg(e.message,'err');if(token){show('listBox');drawChips();if(!orders.length)$('list').innerHTML=''}}
  }
  function start(){
    token=sget(TK);msg('');
    if(!api()){msg('Не задан адрес API (api-config.js)','err');return}
    if(!token){show('loginBox');return}
    msg('Загрузка заказов…','hint');load();clearInterval(timer);timer=setInterval(function(){if(!document.hidden&&token)load()},20000);
  }
  $('loginBtn').onclick=async function(){var b=this;b.disabled=true;try{var d=await call('POST','/api/login',{password:$('pw').value});token=d.token;sset(TK,token);$('pw').value='';start()}catch(e){msg(e.message,'err')}b.disabled=false};
  $('pw').addEventListener('keydown',function(e){if(e.key==='Enter')$('loginBtn').click()});
  $('logoutBtn').onclick=function(){token='';sset(TK,'');show('loginBox')};
  var bl=[];
  function blN(v){return String(v||'').replace(/\D/g,'').slice(-9)}
  function blFmt(v){return v.replace(/(\d{3})(\d{3})(\d{3})/,'+996 $1 $2 $3')}
  function blDraw(){
    $('blCount').textContent='('+bl.length+')';
    $('blList').innerHTML=bl.length?bl.map(function(x){return '<div style="display:flex;gap:8px;align-items:center;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line)"><div><b>'+esc(blFmt(x.value))+'</b><div style="font-size:12px;opacity:.7">'+esc(x.reason||'')+' · '+new Date(x.created_at).toLocaleDateString('ru-RU')+'</div></div><button data-v="'+esc(x.value)+'" class="blDel">Убрать</button></div>'}).join(''):'<div style="opacity:.7">Список пуст</div>';
    [].forEach.call(document.querySelectorAll('.blDel'),function(b){b.onclick=async function(){
      var v=b.getAttribute('data-v');if(!confirm('Убрать '+blFmt(v)+' из чёрного списка? С этого номера снова можно будет делать заказы.'))return;
      b.disabled=true;try{await call('POST','/api/admin/blacklist/remove',{value:v});msg('Номер убран из списка');blLoad()}catch(e){msg(e.message,'err');b.disabled=false}}});
  }
  async function blLoad(){try{var d=await call('GET','/api/admin/blacklist');bl=d.items||[];blDraw()}catch(e){$('blList').innerHTML='<div style="opacity:.7">'+esc(e.message)+'</div>'}}
  $('blCheck').onclick=function(){var v=blN($('blPhone').value);if(v.length<9){$('blRes').textContent='Введите номер полностью (9 цифр)';return}
    var f=bl.filter(function(x){return x.value===v})[0];$('blRes').textContent=f?'🚫 '+blFmt(v)+' В ЧЁРНОМ СПИСКЕ: '+(f.reason||''):'✅ '+blFmt(v)+' нет в чёрном списке'};
  $('blAdd').onclick=async function(){var b=this,v=blN($('blPhone').value);if(v.length<9){$('blRes').textContent='Введите номер полностью (9 цифр)';return}
    b.disabled=true;try{await call('POST','/api/admin/blacklist',{phone:v,reason:$('blReason').value});$('blReason').value='';$('blRes').textContent='🚫 '+blFmt(v)+' добавлен';await blLoad()}catch(e){msg(e.message,'err')}b.disabled=false};
  $('reload').onclick=function(){load();blLoad()};
  start();
})();
</script>
</body>
</html>
