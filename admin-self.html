<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Для себя — diamond.kg</title>
<style>
:root{--bg:#0B1020;--card:#151D33;--line:rgba(170,184,208,.2);--tx:#f0f4ff;--mu:#AAB8D0;--gold:#32D9F5;--blue:#7C83FF;--red:#ff5d5d;--green:#25D366}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 80px}
h1{font-size:1.4rem;margin:8px 0 12px}
a{color:var(--gold)}
label{display:block;font-size:.85rem;color:var(--mu);margin:12px 0 4px}
input{width:100%;background:#0B1020;color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit;min-height:46px}
button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:12px 16px;cursor:pointer;min-height:46px;color:var(--tx);background:#1D2943}
button.pri{background:var(--gold);color:#0B1020}
button.ok{background:var(--green);color:#06210f}
button.dng{background:#5a1f2a;color:#ffd6d6}
button:disabled{opacity:.5;cursor:default}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.hidden{display:none}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chips button{min-height:38px;padding:6px 12px;font-size:.9rem}
.chips button.on{background:var(--gold);color:#0B1020}
.o-head{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.o-head b{font-size:1.05rem}
.o-sum{font-weight:800;color:var(--gold);white-space:nowrap}
.o-meta{color:var(--mu);font-size:.88rem;margin:4px 0 10px;word-break:break-word}
.st{font-size:.75rem;padding:2px 8px;border-radius:999px;background:#1D2943;margin-left:6px;white-space:nowrap}
.st.new{background:#7a5a0a}.st.processing{background:#1D2943}.st.delivered{background:#12633a}
.st.refund_due{background:#7a1f2a}.st.refunded{background:#555d6e}.st.balance{background:#12633a}.st.manual{background:#6b4a12}.st.cancelled{background:#444}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.acts button{flex:1 1 140px}
.err{color:#ffd6d6;background:#5a1f2a;padding:10px 12px;border-radius:10px;margin-bottom:12px}
.good{color:#06210f;background:var(--green);padding:10px 12px;border-radius:10px;margin-bottom:12px}
.hint{color:var(--mu);padding:8px 0}
.warn{color:#ffd28a;font-size:.85rem;margin-top:6px}
.rcpt img{display:block;max-width:100%;max-height:420px;border-radius:10px;border:1px solid var(--line);margin-top:10px;background:#0B1020}
.rcpt-hint{color:var(--mu);font-size:.85rem;margin-top:6px}
select{width:100%;background:#0B1020;color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit;min-height:46px}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;background:#0B1020;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-top:6px;word-break:break-all;user-select:all}
</style>
</head>
<body>
<div class="wrap">
  <h1>Заказ для себя</h1>
  <div class="hint">Без оплаты, сразу поставщику по себестоимости. В выручку и налог не попадает.</div>
  <div id="msg"></div>

  <div class="card hidden" id="loginBox">
    <label for="pw">Пароль админки</label>
    <input id="pw" type="password" autocomplete="current-password">
    <div style="margin-top:10px"><button class="pri" id="loginBtn">Войти</button></div>
  </div>

  <div id="mainBox" class="hidden">
    <div class="card">
      <label for="game">Игра или сервис</label><select id="game"></select>
      <label for="pack">Пакет</label><select id="pack"></select>
      <div id="f-id"><label for="pid" id="pidL">ID игрока</label><input id="pid" inputmode="numeric" autocomplete="off"></div>
      <div id="f-srv"><label for="srv" id="srvL">Zone ID</label><input id="srv" inputmode="numeric" autocomplete="off"><select id="srvSel" class="hidden"></select></div>
      <div class="hint" id="hint"></div>
      <div style="margin-top:12px"><button class="pri" id="go">Отправить заказ</button></div>
    </div>
    <h1 style="font-size:1.1rem">Последние заказы для себя</h1>
    <div id="list"></div>
    <div class="top" style="margin-top:14px"><button id="reload">Обновить</button><button id="logoutBtn">Выйти</button></div>
  </div>
</div>
<script src="api-config.js"></script>
<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  var TK='dk_admin_token', AK='dk_admin_api', token='', games=[], busy=false;
  function sget(k){try{return localStorage.getItem(k)||''}catch(e){return ''}}
  function sset(k,v){try{v?localStorage.setItem(k,v):localStorage.removeItem(k)}catch(e){}}
  function api(){return (window.DK_API||sget(AK)||'').replace(/\/+$/,'')}
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function msg(t,k){$('msg').innerHTML=t?'<div class="'+(k||'good')+'">'+esc(t)+'</div>':''}
  function show(id){['loginBox','mainBox'].forEach(function(x){$(x).classList.toggle('hidden',x!==id)})}
  async function call(method,path,body){
    var h={}; if(token)h.Authorization='Bearer '+token;
    var o={method:method,headers:h};
    if(body!==undefined){h['Content-Type']='application/json';o.body=JSON.stringify(body)}
    var r; try{r=await fetch(api()+path,o)}catch(e){throw new Error('Сервер не отвечает. Проверьте интернет.')}
    var d={}; try{d=await r.json()}catch(e){}
    if(r.status===401&&path!=='/api/login'){token='';sset(TK,'');show('loginBox');throw new Error('Войдите заново')}
    if(!r.ok)throw new Error(d.error||('Ошибка '+r.status));
    return d;
  }
  function cur(){return games.filter(function(g){return g.id===$('game').value})[0]}
  function drawGame(){
    var g=cur(); if(!g)return;
    $('pack').innerHTML=g.packs.map(function(p){return '<option value="'+esc(p.k)+'">'+esc(p.l)+'</option>'}).join('');
    $('f-id').classList.toggle('hidden',!!g.none);
    var needSrv=!g.none&&!g.user&&(g.mlbb||g.zone||g.servers);
    $('f-srv').classList.toggle('hidden',!needSrv);
    $('srv').classList.toggle('hidden',!!g.servers);$('srvSel').classList.toggle('hidden',!g.servers);
    if(g.servers)$('srvSel').innerHTML=g.servers.map(function(s){return '<option value="'+esc(s.v)+'">'+esc(s.l)+'</option>'}).join('');
    $('pidL').textContent=g.user?'Telegram @username':'ID игрока';
    $('pid').inputMode=g.user?'text':'numeric';
    $('srvL').textContent=g.servers?'Сервер':(g.mlbb?'Zone ID':'Server ID');
    $('hint').textContent=g.none?'Вводить ничего не нужно, код появится в списке ниже.':(g.hint||'');
  }
  var LBL={new:'В очереди',processing:'Выдаётся',delivered:'Выдан',manual:'Проверить вручную',cancelled:'Не выполнен',refund_due:'Не выполнен'};
  function ago(ts){var m=Math.round((Date.now()-ts)/60000);if(m<1)return 'только что';if(m<60)return m+' мин назад';var h=Math.round(m/60);if(h<24)return h+' ч назад';return new Date(ts).toLocaleDateString('ru-RU')}
  async function loadList(){
    try{
      var d=await call('GET','/api/admin/self-orders'), o=d.orders||[];
      $('list').innerHTML=o.length?o.map(function(x){
        var who=(x.player_id&&x.player_id!=='-')?' · ID '+esc(x.player_id)+(x.server_id&&x.server_id!=='-'?' ('+esc(x.server_id)+')':''):'';
        return '<div class="card"><div class="o-head"><div><b>'+esc(x.id)+'</b><span class="st '+esc(x.status)+'">'+esc(LBL[x.status]||x.status)+'</span></div><div class="o-sum">'+(x.cost_usd?'$'+Number(x.cost_usd).toFixed(2):'')+'</div></div>'
          +'<div class="o-meta">'+esc(x.pkg_label)+who+' · '+ago(x.created_at)+'</div>'
          +(x.delivery?'<div class="code">'+esc(x.delivery)+'</div>':'')
          +(x.fail_reason?'<div class="warn">'+esc(x.fail_reason)+'</div>':'')+'</div>';
      }).join(''):'<div class="hint">Заказов пока нет</div>';
    }catch(e){msg(e.message,'err')}
  }
  async function init(){
    try{
      var d=await call('GET','/api/admin/self-catalog'); games=d.games||[];
      $('game').innerHTML=games.map(function(g){return '<option value="'+esc(g.id)+'">'+esc(g.name)+'</option>'}).join('');
      drawGame();show('mainBox');loadList();
    }catch(e){msg(e.message,'err')}
  }
  $('game').onchange=drawGame;
  $('go').onclick=async function(){
    if(busy)return; var g=cur(); if(!g)return;
    var pk=$('pack'), label=pk.options[pk.selectedIndex].text;
    var pid=$('pid').value.trim(), srv=g.servers?$('srvSel').value:$('srv').value.trim();
    if(!g.none&&!pid){msg('Введите ID','err');return}
    if(!g.none&&!g.user&&(g.mlbb||g.zone)&&!srv){msg('Введите '+$('srvL').textContent,'err');return}
    if(!confirm('Отправить заказ себе?\n'+g.name+': '+label+(g.none?'':'\nID '+pid+(srv?' ('+srv+')':''))+'\n\nДеньги спишутся с баланса FazerCards по себестоимости.'))return;
    busy=true;this.disabled=true;msg('Отправляю…','hint');
    try{var d=await call('POST','/api/admin/self-order',{game:g.id,pack:pk.value,playerId:pid,serverId:srv});msg('Заказ '+d.id+' отправлен','good');$('pid').value='';await loadList()}
    catch(e){msg(e.message,'err')}
    busy=false;this.disabled=false;
  };
  $('loginBtn').onclick=async function(){var b=this;b.disabled=true;try{var d=await call('POST','/api/login',{password:$('pw').value});token=d.token;sset(TK,token);$('pw').value='';msg('');init()}catch(e){msg(e.message,'err')}b.disabled=false};
  $('pw').addEventListener('keydown',function(e){if(e.key==='Enter')$('loginBtn').click()});
  $('logoutBtn').onclick=function(){token='';sset(TK,'');show('loginBox')};
  $('reload').onclick=loadList;
  setInterval(function(){if(!document.hidden&&token&&!$('mainBox').classList.contains('hidden'))loadList()},15000);
  token=sget(TK); if(!api()){msg('Не задан адрес API (api-config.js)','err')} else if(token)init(); else show('loginBox');
})();
</script>
</body>
</html>
