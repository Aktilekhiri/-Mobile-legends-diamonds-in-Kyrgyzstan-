<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Админка — diamond.kg</title>
<style>
:root{--bg:#0B1020;--surface:#10182B;--card:#151D33;--line:rgba(170,184,208,.2);--tx:#F5F7FF;--mu:#AAB8D0;--cy:#32D9F5;--red:#ff5d5d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
nav.bn{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(16,24,43,.97);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));backdrop-filter:blur(8px)}
.bar{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.tab{position:relative;font:inherit;font-weight:700;font-size:.72rem;min-height:56px;padding:6px 4px;border:0;border-radius:14px;background:transparent;color:var(--mu);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-selected="true"]{background:rgba(50,217,245,.14);color:var(--cy)}
.tab:focus-visible{outline:3px solid var(--cy);outline-offset:2px}
.badge{position:absolute;top:2px;left:calc(50% + 6px);min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--red);color:#fff;font-size:.72rem;display:none;align-items:center;justify-content:center}
.badge.on{display:inline-flex}
iframe{display:block;width:100%;border:0;background:var(--bg);min-height:60vh}
.frame{max-width:760px;margin:0 auto;padding-bottom:90px}
.hidden{display:none}
</style>
</head>
<body>

<div class="frame">
  <iframe id="f-orders" src="admin-orders.html" title="Заказы"></iframe>
  <iframe id="f-reviews" class="hidden" src="admin-reviews.html" title="Отзывы"></iframe>
  <iframe id="f-clients" class="hidden" src="admin-clients.html" title="Клиенты"></iframe>
  <iframe id="f-bot" class="hidden" src="admin-bot.html" title="Бот"></iframe>
  <iframe id="f-accounts" class="hidden" src="admin-accounts.html" title="Аккаунты"></iframe>
  <iframe id="f-chat" class="hidden" src="admin-chat.html" title="Чат"></iframe>
  <iframe id="f-finance" class="hidden" src="admin-finance.html" title="Финансы"></iframe>
</div>
<nav class="bn" aria-label="Разделы админки"><div class="bar" role="tablist">
  <button class="tab" role="tab" id="t-orders" aria-selected="true" data-t="orders"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg><span>Заказы</span> <span class="badge" id="badge" title="Требуют действия"></span></button>
  <button class="tab" role="tab" id="t-reviews" aria-selected="false" data-t="reviews"><svg viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg><span>Отзывы</span></button>
  <button class="tab" role="tab" id="t-clients" aria-selected="false" data-t="clients"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><path d="M16 4.7a3.5 3.5 0 010 6.6M18 14.8c2 .7 3.2 2.4 3.5 5.2"/></svg><span>Клиенты</span></button>
  <button class="tab" role="tab" id="t-accounts" aria-selected="false" data-t="accounts"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="9" cy="12" r="2.2"/><path d="M14 10h4M14 14h4"/></svg><span>Аккаунты</span></button>
  <button class="tab" role="tab" id="t-bot" aria-selected="false" data-t="bot"><svg viewBox="0 0 24 24"><rect x="4" y="8" width="16" height="11" rx="3"/><path d="M12 4v4M9 13h.01M15 13h.01M9 16.5h6"/></svg><span>Бот</span></button>
  <button class="tab" role="tab" id="t-chat" aria-selected="false" data-t="chat"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg><span>Чат</span><span class="badge" id="chBadge"></span></button>
  <button class="tab" role="tab" id="t-finance" aria-selected="false" data-t="finance"><svg viewBox="0 0 24 24"><path d="M4 19V9M10 19V5M16 19v-7M21 19H3"/></svg><span>Финансы</span></button>
</div></nav>
<script src="api-config.js"></script>
<script>
(function(){
  var cur='orders';
  function sget(k){try{return localStorage.getItem(k)||''}catch(e){return ''}}
  function show(t){
    cur=t;
    ['orders','reviews','clients','bot','accounts','chat','finance'].forEach(function(x){
      document.getElementById('f-'+x).classList.toggle('hidden',x!==t);
      document.getElementById('t-'+x).setAttribute('aria-selected',x===t?'true':'false');
    });
    try{history.replaceState(null,'','#'+t)}catch(e){}
    window.scrollTo(0,0);
    // вошли в одной вкладке — во второй сразу подхватываем вход
    try{var f=document.getElementById('f-'+t),d=f.contentDocument,lb=d&&d.getElementById('loginBox');
      if(lb&&!lb.classList.contains('hidden')&&sget('dk_admin_token'))f.contentWindow.location.reload();}catch(e){}
    fit();
  }
  Array.prototype.forEach.call(document.querySelectorAll('.tab'),function(b){b.onclick=function(){show(b.dataset.t)}});
  function fit(){
    var f=document.getElementById('f-'+cur);
    try{var d=f.contentDocument;if(d&&d.documentElement){var h=Math.max(d.documentElement.scrollHeight,d.body?d.body.scrollHeight:0);if(h&&Math.abs(f.offsetHeight-h)>2)f.style.height=h+'px'}}catch(e){}
  }
  setInterval(fit,400);
  // badge: сколько заказов требует действия
  async function badge(){
    var tk=sget('dk_admin_token'),api=(window.DK_API||sget('dk_admin_api')||'').replace(/\/+$/,'');
    var el=document.getElementById('badge');
    if(!tk||!api||document.hidden)return;
    try{
      var r=await fetch(api+'/api/admin/orders',{headers:{Authorization:'Bearer '+tk}});
      if(!r.ok){el.classList.remove('on');return}
      var d=await r.json(),n=(d.orders||[]).filter(function(o){return ['new','refund_due','manual'].indexOf(o.status)>-1&&!(o.status==='new'&&o.method==='Finik')}).length;
      el.textContent=n;el.classList.toggle('on',n>0);
    }catch(e){}
  }
  async function chBadge(){
    var tk=sget('dk_admin_token'),api=(window.DK_API||sget('dk_admin_api')||'').replace(/\/+$/,''),el=document.getElementById('chBadge');
    if(!tk||!api||document.hidden)return;
    try{var r=await fetch(api+'/api/admin/chats',{headers:{Authorization:'Bearer '+tk}});if(!r.ok)return;var d=await r.json();el.textContent=d.unread;el.classList.toggle('on',d.unread>0)}catch(e){}
  }
  chBadge();setInterval(chBadge,20000);
  badge();setInterval(badge,20000);
  window.addEventListener('storage',badge);
  show(location.hash==='#chat'?'chat':location.hash==='#finance'?'finance':location.hash==='#accounts'?'accounts':(location.hash==='#reviews'?'reviews':(location.hash==='#clients'?'clients':(location.hash==='#bot'?'bot':'orders'))));
})();
</script>
</body>
</html>
