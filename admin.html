<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Админка — diamond.kg</title>
<style>
:root{--bg:#0B1020;--surface:#10182B;--card:#151D33;--line:rgba(170,184,208,.2);--tx:#F5F7FF;--mu:#AAB8D0;--cy:#32D9F5;--red:#ff5d5d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:0;z-index:10;background:rgba(11,16,32,.96);border-bottom:1px solid var(--line)}
.bar{max-width:760px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:8px}
.brand{font-weight:800;margin-right:auto;white-space:nowrap}
.brand b{color:var(--cy)}
.tab{font:inherit;font-weight:700;min-height:44px;padding:0 16px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--mu);cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.tab[aria-selected="true"]{background:var(--cy);color:#0B1020;border-color:var(--cy)}
.tab:focus-visible{outline:3px solid var(--cy);outline-offset:2px}
.badge{min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--red);color:#fff;font-size:.78rem;display:none;align-items:center;justify-content:center}
.badge.on{display:inline-flex}
iframe{display:block;width:100%;border:0;background:var(--bg);min-height:60vh}
.frame{max-width:760px;margin:0 auto}
.hidden{display:none}
@media (max-width:420px){.brand{display:none}.bar{justify-content:center}.tab{flex:1;justify-content:center}}
</style>
</head>
<body>
<header><div class="bar" role="tablist" aria-label="Разделы админки">
  <span class="brand"><b>Diamond</b>.kg · админка</span>
  <button class="tab" role="tab" id="t-orders" aria-selected="true" data-t="orders">Заказы <span class="badge" id="badge" title="Требуют действия"></span></button>
  <button class="tab" role="tab" id="t-reviews" aria-selected="false" data-t="reviews">Отзывы</button>
  <button class="tab" role="tab" id="t-accounts" aria-selected="false" data-t="accounts">Аккаунты</button>
</div></header>
<div class="frame">
  <iframe id="f-orders" src="admin-orders.html" title="Заказы"></iframe>
  <iframe id="f-reviews" class="hidden" src="admin-reviews.html" title="Отзывы"></iframe>
  <iframe id="f-accounts" class="hidden" src="admin-accounts.html" title="Аккаунты"></iframe>
</div>
<script src="api-config.js"></script>
<script>
(function(){
  var cur='orders';
  function sget(k){try{return localStorage.getItem(k)||''}catch(e){return ''}}
  function show(t){
    cur=t;
    ['orders','reviews','accounts'].forEach(function(x){
      document.getElementById('f-'+x).classList.toggle('hidden',x!==t);
      document.getElementById('t-'+x).setAttribute('aria-selected',x===t?'true':'false');
    });
    try{history.replaceState(null,'','#'+t)}catch(e){}
    window.scrollTo(0,0);
    // вошли в одной вкладке — во второй сразу подхватываем вход
    try{var f=document.getElementById('f-'+t),d=f.contentDocument,lb=d&&d.getElementById('loginBox');
      if(lb&&!lb.classList.contains('hidden')&&sget('dk_admin_token'))f.contentWindow.location.reload();}catch(e){}
    fit();
  }
  Array.prototype.forEach.call(document.querySelectorAll('.tab'),function(b){b.onclick=function(){show(b.dataset.t)}});
  function fit(){
    var f=document.getElementById('f-'+cur);
    try{var d=f.contentDocument;if(d&&d.documentElement){var h=Math.max(d.documentElement.scrollHeight,d.body?d.body.scrollHeight:0);if(h&&Math.abs(f.offsetHeight-h)>2)f.style.height=h+'px'}}catch(e){}
  }
  setInterval(fit,400);
  // badge: сколько заказов требует действия
  async function badge(){
    var tk=sget('dk_admin_token'),api=(window.DK_API||sget('dk_admin_api')||'').replace(/\/+$/,'');
    var el=document.getElementById('badge');
    if(!tk||!api||document.hidden)return;
    try{
      var r=await fetch(api+'/api/admin/orders',{headers:{Authorization:'Bearer '+tk}});
      if(!r.ok){el.classList.remove('on');return}
      var d=await r.json(),n=(d.orders||[]).filter(function(o){return ['new','refund_due','manual'].indexOf(o.status)>-1}).length;
      el.textContent=n;el.classList.toggle('on',n>0);
    }catch(e){}
  }
  badge();setInterval(badge,20000);
  window.addEventListener('storage',badge);
  show(location.hash==='#accounts'?'accounts':(location.hash==='#reviews'?'reviews':'orders'));
})();
</script>
</body>
</html>
