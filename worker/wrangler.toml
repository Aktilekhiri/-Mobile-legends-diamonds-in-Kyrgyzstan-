name = "mobile-legends-diamonds-in-kyrgyzstan"
main = "src/index.js"
compatibility_date = "2025-07-01"

[[d1_databases]]
binding = "DB"
database_name = "diamond-accounts-db"
database_id = "72790b16-1c38-4ac7-94fc-bd7e5b94f4bc"

[ai]
binding = "AI"

[triggers]
crons = ["* * * * *"]

[observability]
enabled = true

# Секрет (пароль админки) задаётся в Cloudflare, а не здесь:
# Workers & Pages -> diamond-kg-api -> Settings -> Variables and Secrets -> ADMIN_PASSWORD (тип Secret)

# Секреты (Settings -> Variables and Secrets): FAZERCARDS_API_KEY, FAZERCARDS_WEBHOOK_SECRET,
# TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID (последние два — для уведомлений).

# Оплата через Finik (включается, когда заданы все четыре секрета; пока пусто, кнопка оплаты скрыта):
# FINIK_API_KEY, FINIK_PRIVATE_KEY (PEM, наш приватный ключ), FINIK_PUBLIC_KEY (PEM, публичный ключ Finik для проверки вебхуков), FINIK_ACCOUNT_ID.
# Необязательно: FINIK_QR_NAME (имя QR, по умолчанию diamondkg), FINIK_BASE (https://beta.api.acquiring.averspay.kg для тестов), FINIK_FEE_PCT (по умолчанию 0.02).

# Оплата через GoPay (ELQR, любой банковский приложение КР; включается, когда заданы три секрета):
# GOPAY_API_KEY, GOPAY_SECRET_KEY (ключ и секрет из кабинета, Test или Live), GOPAY_WEBHOOK_SECRET (Developer → Webhooks).
# Необязательно: GOPAY_PUBLIC=1 (показать кнопку клиентам; пока пусто, тест по ссылке diamond.kg/?gopaytest=1),
# GOPAY_FEE_PCT (комиссия, по умолчанию 0.02). Вебхук: https://<воркер>/api/gopay/webhook, событие payment.committed.

# ИИ-чат (сайт и Telegram-бот): по умолчанию бесплатный Cloudflare Workers AI (binding [ai] выше, ключ не нужен).
# Платный запасной вариант: секрет ANTHROPIC_API_KEY и переменная AI_PROVIDER=anthropic.
# Необязательно: AI_MODEL (по умолчанию claude-haiku-5-5), AI_PER_HOUR (сообщений с одного IP в час, 40), AI_PER_DAY (всего в сутки, 800).
